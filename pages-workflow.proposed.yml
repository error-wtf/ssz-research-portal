name: Validate and deploy SSZ portal
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install mpmath
      - name: Rebuild deterministic public scientific data
        run: |
          python3 scripts/build_strong_field_certificates.py
          python3 scripts/build_scientific_matrices.py
      - name: Validate content, provenance and physics
        run: |
          python3 scripts/validate_content.py
          python3 scripts/check_links.py
          python3 scripts/check_external_links.py
          python3 scripts/check_secrets.py
          python3 scripts/validate_claims.py
          python3 scripts/validate_provenance.py
          python3 scripts/validate_json_schemas.py
          node scripts/test_physics.js
          node scripts/test_browser_physics.mjs
          node scripts/test_interactions.js
          node scripts/test_metric_explorer.js
      - name: Upload validated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: {path: .}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
